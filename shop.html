<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop — Dar Sahar Arabian Perfume</title>
<meta name="description" content="Shop authentic Arabian perfumes, decants and body sprays. Filter by scent family, for him, for her or unisex.">
<meta name="theme-color" content="#0d0a08">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230d0a08'/%3E%3Cpath d='M23.5 13.5a7 7 0 1 0 2.6 9.6 5.6 5.6 0 1 1-2.6-9.6Z' fill='%23c9a45c'/%3E%3C/svg%3E">
<style>
.bar{position:sticky;top:64px;z-index:20;background:rgba(13,10,8,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-block:1px solid var(--line);padding:14px 0;margin-bottom:40px}
@media(min-width:901px){.bar{top:72px}}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
.bar .r1{display:flex;gap:10px;align-items:center}
.search{flex:1;position:relative}
.search input{padding-left:42px;height:44px;border-radius:99px}
.search svg{position:absolute;left:15px;top:13px;width:18px;height:18px;color:var(--mute)}
.bar select.field{width:auto;height:44px;border-radius:99px;padding-right:38px;font-size:14px;background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px}
.seg{display:flex;border:1px solid var(--line2);border-radius:99px;padding:3px;flex:none}
.seg button{height:36px;padding:0 14px;border-radius:99px;font-size:13px;color:var(--mute);transition:.3s}
.seg button.on{background:var(--gold);color:var(--ink)}
.count{font-size:13px;color:var(--mute);letter-spacing:.08em}
.fam-intro{display:none;grid-template-columns:120px 1fr;gap:20px;align-items:center;margin-bottom:34px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--ink2)}
.fam-intro.on{display:grid}
.fam-intro img{width:120px;height:120px;object-fit:cover;border-radius:14px}
@media(max-width:700px){.bar .r1{flex-wrap:wrap}.search{flex:1 0 100%}.seg{flex:1 0 100%}.seg button{flex:1;padding:0 6px}.bar select.field{flex:1}.grid{grid-template-columns:1fr 1fr;gap:22px 12px}.card h3{font-size:20px}.card .meta{flex-direction:column;gap:4px}.card .price{text-align:left}.card .notes-mini{display:none}.gtag{display:none}}
</style>
</head>
<body data-page="shop">
<header class="phead"><div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
  <div class="ar-bg ar" aria-hidden="true">عطور</div>
  <h1>The <em>collection</em></h1>
  <p class="lead" style="margin-top:18px">Every bottle is sealed and authentic. Every scent comes in 5ml or 10ml decants too — so you can try before you commit.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="r1">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="field" id="q" type="search" placeholder="Search Khamrah, vanilla, oud…" aria-label="Search fragrances"></label>
    <div class="seg" id="gseg"><button data-g="" class="on">All</button><button data-g="her">Her</button><button data-g="him">Him</button><button data-g="unisex">Unisex</button></div>
    <select class="field" id="sort" aria-label="Sort"><option value="feat">Featured</option><option value="lo">Price: low → high</option><option value="hi">Price: high → low</option><option value="proj">Loudest first</option><option value="long">Longest lasting</option></select>
  </div>
  <div class="chips" id="fchips"></div>
</div></div>

<main class="wrap">
  <div class="fam-intro" id="famintro"></div>
  <div class="count" id="count" style="margin-bottom:20px"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="none" hidden><span class="ar">؟</span><p>No fragrance matches that — but we probably have it. <a class="link" id="none-wa" target="_blank" rel="noopener">Ask us on WhatsApp →</a></p></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  const P = new URLSearchParams(location.search);
  const st = { g:P.get('g')||'', fam:P.get('fam')||(P.get('f')==='sale'?'sale':''), q:'', sort:'feat' };
  const chips = [['','All'],['sale','On sale'],['new','New in'],...Object.entries(FAMILIES).map(([k,f])=>[k,f.label]),['body','Body sprays'],['home','Oils & home']];
  $('#fchips').innerHTML = chips.map(([k,l])=>`<button class="chip ${k===st.fam?'on':''}" data-f="${k}">${famColor[k]?`<span class="fam-dot" style="background:${famColor[k]};margin:0"></span>`:''}${l}</button>`).join('');
  $$('#gseg button').forEach(b=>b.classList.toggle('on',b.dataset.g===st.g));

  function render(){
    const q = st.q.trim().toLowerCase();
    let L = PRODUCTS.filter(p=>{
      if (st.g && p.g!==st.g && !(st.g!=='unisex' && p.g==='unisex')) return false; // unisex shows under Her and Him too
      if (st.fam==='sale' && !p.tags.includes('sale')) return false;
      if (st.fam==='new' && !p.tags.includes('new')) return false;
      if (st.fam==='body' && !p.body) return false;
      if (st.fam==='home' && !(p.home||p.oil)) return false;
      if (FAMILIES[st.fam] && p.fam!==st.fam) return false;
      if (q && ![p.name,p.house,p.desc,...p.notes.top,...p.notes.heart,...p.notes.base,FAMILIES[p.fam].label].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    const rank = p => (p.tags.includes('bestseller')?0:p.tags.includes('new')?1:2);
    L.sort({feat:(a,b)=>rank(a)-rank(b),lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,proj:(a,b)=>b.s-a.s,long:(a,b)=>b.l-a.l}[st.sort]);
    $('#grid').innerHTML = L.map(cardHTML).join('');
    $('#count').textContent = `${L.length} fragrance${L.length===1?'':'s'}`;
    $('#none').hidden = !!L.length;
    $('#none-wa').href = waLink(`Hi ${SHOP}! 🌙 Do you have ${st.q||'a fragrance'}?`);
    const f = FAMILIES[st.fam];
    $('#famintro').classList.toggle('on',!!f);
    if (f) $('#famintro').innerHTML = `<img src="${f.img}" alt=""><div><div class="eyebrow">Scent family</div><h3 style="font-size:34px;margin:6px 0">${f.label}</h3><p style="color:var(--mute)">${f.blurb}</p></div>`;
    $$('#grid .card').forEach((c,i)=>{c.style.opacity=0;c.style.transform='translateY(24px)';setTimeout(()=>{c.style.transition='opacity .8s var(--ease),transform .8s var(--ease)';c.style.opacity=1;c.style.transform='none'},40*i)});
    const u = new URLSearchParams(); if(st.g)u.set('g',st.g); if(st.fam)u.set('fam',st.fam); history.replaceState(null,'','?'+u);
  }
  $('#fchips').onclick = e=>{const b=e.target.closest('.chip'); if(!b)return; st.fam=b.dataset.f; $$('#fchips .chip').forEach(c=>c.classList.toggle('on',c===b)); render();};
  $('#gseg').onclick = e=>{const b=e.target.closest('button'); if(!b)return; st.g=b.dataset.g; $$('#gseg button').forEach(c=>c.classList.toggle('on',c===b)); render();};
  $('#sort').onchange = e=>{st.sort=e.target.value; render();};
  $('#q').oninput = e=>{st.q=e.target.value; render();};
  render();
  window.WA_CONTEXT = () => ['Ask about a scent', `Hi ${SHOP}! 🌙 I'm browsing your collection and I'd like some help choosing.`];
  updateFloat();
})();
</script>
</body>
</html>
